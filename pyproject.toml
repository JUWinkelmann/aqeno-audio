[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqeno"
version = "0.1.0"
description = "Open, adaptive, audio-first player platform"
requires-python = ">=3.11"
dependencies = [
    # mutagen 1.48.1, GPL-2.0-or-later. Licence recorded per ADR 0004 § 2: the
    # "no GPL linked into the application" constraint is on hold while nothing is
    # distributed (ADR 0006), so this is permitted today. It is confined to one
    # adapter module (adapters/metadata/mutagen_probe.py) behind the MediaProbe
    # port, so the exposure is bounded by construction (ADR 0014 § 1).
    "mutagen>=1.47,<2",
]

# PySide6 and PyGObject are intentionally absent: they come from system packages.
# See DEVELOPMENT.md — installing them through pip on Debian/Raspberry Pi OS
# reliably produces a broken build.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# RH1 control adapters.  These Adafruit CircuitPython packages and Blinka are
# MIT-licensed; they stay optional so the headless Core and desktop tests do
# not acquire a Raspberry Pi/I2C dependency.
rh1 = [
    "adafruit-blinka>=8",
    "adafruit-circuitpython-seesaw>=1",
    "adafruit-circuitpython-neokey>=1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware' --strict-markers"
markers = [
    "hardware: requires Reference hardware attached; never runs in CI",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/aqeno/domain", "src/aqeno/application", "src/aqeno/ports"]
